name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate
      - name: Build
        working-directory: apps/api
        run: pnpm build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: care
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate
      - name: Run migrations
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/care
      - name: Run tests
        working-directory: apps/api
        run: pnpm test:cov
        env:
          DATABASE_URL: postgresql://app:app@localhost:5432/care
          REDIS_URL: redis://localhost:6379
          FIELD_ENCRYPTION_KEY: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
          JWT_SECRET: ci-test-jwt-secret-not-for-production

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      # AES-256-GCM 32-byte key (base64-encoded)
      FIELD_ENCRYPTION_KEY: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
      # JWT signing secret (CI only)
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      # Testcontainers needs Docker socket path
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate
      - name: Pre-pull Postgres image (with retry)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: pulling postgres:16-alpine..."
            docker pull postgres:16-alpine && break
            echo "Pull failed, waiting 10s..."
            sleep 10
          done
          docker image ls postgres:16-alpine
      - name: Pre-pull Redis image (with retry)
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: pulling redis:7-alpine..."
            docker pull redis:7-alpine && break
            echo "Pull failed, waiting 10s..."
            sleep 10
          done
          docker image ls redis:7-alpine
      - name: Run E2E tests
        working-directory: apps/api
        run: pnpm test:e2e
